[tox]
requires = tox-uv>=1.29
env_list = py311, py312, py313, py314, fmt, lint, type, qa
skip_missing_interpreter = true


[testenv]
description = Run tests
package = editable
deps = 
    pytest>=8.3
    pytest-cov>=5.0
ensure_pip = true
commands = pytest {posargs:tests}

# ----- Formatting -----
[testenv:fmt]
description = Format code with Black
skip_install = true
deps = black>=24.10.0
commands = black . {posargs}

# ----- Linting -----
[testenv:lint]
description = Run Ruff (lint + import sorting)
skip_install = true
deps = ruff>=0.6.0
commands =
    # Check linting rules
    ruff check . {posargs}
    # Ensure imports are sorted consistently
    ruff check --select I --fix . {posargs}

# ----- Typing -----
[testenv:type]
description = Static type checking
skip_install = false
deps = mypy>=1.10
commands = mypy --install-types --non-interactive {posargs:src tests}

# ----- QA aggregate -----
[testenv:qa]
description = Run all quality checks (format check + lint + type)
skip_install = true
deps =
    {[testenv:fmt]deps}
    {[testenv:lint]deps}
    {[testenv:type]deps}
commands =
    # Check code formatting
    black --check . {posargs}
    # Run Ruff for lint & import order
    ruff check . {posargs}
    # Run type checks
    {[testenv:type]commands}

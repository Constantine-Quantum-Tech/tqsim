version: 2.1

executors:
  py:
    parameters:
      tag:
        type: string
        default: "3.12"
    docker:
      - image: cimg/python:<< parameters.tag >>

commands:
  install-uv:
    steps:
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            uv --version

  restore-uv-cache:
    steps:
      - restore_cache:
          keys:
            - v1-uv-{{ arch }}-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ checksum "pyproject.toml" }}-{{ checksum "tox.ini" }}
            - v1-uv-{{ arch }}-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ checksum "pyproject.toml" }}
            - v1-uv-{{ arch }}-{{ .Environment.CIRCLE_JOB }}

  save-uv-cache:
    steps:
      - save_cache:
          key: v1-uv-{{ arch }}-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ checksum "pyproject.toml" }}-{{ checksum "tox.ini" }}
          paths:
            - ~/.cache/uv

jobs:
  test:
    parameters:
      py:
        type: string
    executor:
      name: py
      tag: << parameters.py >>
    steps:
      - checkout
      - restore-uv-cache
      - install-uv
      - run:
          name: Sync dev dependencies
          command: uv sync --dev
      - run:
          name: Run tests via tox-uv
          command: |
            case "<< parameters.py >>" in
              3.11) env=py311 ;;
              3.12) env=py312 ;;
              3.13) env=py313 ;;
              3.14) env=py314 ;;
            esac
            uvx tox -e "$env" -- tests -q
      - save-uv-cache

workflows:
  tests:
    jobs:
      - test:
          matrix:
            parameters:
              py: ["3.11", "3.12", "3.13", "3.14"]